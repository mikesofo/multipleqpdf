# Default development pipeline: Claude plans, Gemini edits.
model: anthropic/claude-opus-4-6
architect: true
editor-model: gemini/gemini-2.5-pro
editor-edit-format: editor-diff

# Used for commit messages and chat summarisation.
weak-model: anthropic/claude-haiku-4-5

# Keep repository context focused.
map-tokens: 2048

# Do not offer to add a broad ".aider*" rule to .gitignore.
gitignore: false

# Convenient roles to select inside Aider.
alias:
  - "architect:anthropic/claude-opus-4-6"
  - "programmer:gemini/gemini-2.5-pro"
  - "grunt:deepseek/deepseek-v4-pro"
  - "reviewer:openai/gpt-5.4"

# Run quality checks after edits once the project has them.
auto-lint: true
auto-test: false
