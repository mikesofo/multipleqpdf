[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2anki-mcq"
version = "0.1.0"
description = "Generate Anki MCQ decks from PDFs using Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "genanki>=0.13",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2anki"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "integration: opt-in integration tests that call the live Anthropic API",
]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "tests"]
explicit_package_bases = true
ignore_missing_imports = true
